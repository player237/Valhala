name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          # Validate expected content in test file.
          grep -Fq "un beau garcon" test.txt
          echo "Tests passed"